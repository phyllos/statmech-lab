[theme]
base = "light"
primaryColor = "#087E8B"
backgroundColor = "#F7F8FA"
secondaryBackgroundColor = "#EEF2F5"
textColor = "#182B3A"
font = "sans serif"

[server]
headless = true
# Hosting controls the bind address. For local-only access, pass
# --server.address=127.0.0.1 to the Streamlit command.

[browser]
gatherUsageStats = false
